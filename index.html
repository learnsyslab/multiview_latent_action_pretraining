<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-View Latent Action Pretraining for Cross-Embodiment Robot Learning from Videos</title>
  <meta name="description" content="Supplementary video for the anonymous submission &quot;Multi-View Latent Action Pretraining for Cross-Embodiment Robot Learning from Videos&quot;.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #18181b;
      --muted: #71717a;
      --card: #ffffff;
      --border: #e4e4e7;
      --accent: #1d6996;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -8px rgba(0,0,0,.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f11;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --card: #18181b;
        --border: #27272a;
        --accent: #6cb4e4;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -8px rgba(0,0,0,.6);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 72px 16px 48px;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 {
      font-size: clamp(1.55rem, 1.05rem + 2vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin: 0 auto 20px;
      max-width: 960px;
      text-wrap: balance;
    }
    .subtitle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
    }
    .subtitle::before {
      content: "";
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }
    .video {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    @media (max-width: 600px) {
      main { padding-top: 40px; }
      header { margin-bottom: 28px; }
      .video { border-radius: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Multi-View Latent Action Pretraining for<br>Cross&#8209;Embodiment Robot Learning from&nbsp;Videos</h1>
      <p class="subtitle">Anonymous Authors</p>
    </header>

    <section class="video" aria-label="Supplementary video">
      <video controls playsinline preload="metadata" poster="video/poster.jpg">
        <source src="video/paper_video.mp4" type="video/mp4">
        Your browser does not support HTML5 video. <a href="video/paper_video.mp4">Download the video</a>.
      </video>
    </section>

  </main>
</body>
</html>
